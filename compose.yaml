services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: onion
      MYSQL_USER: onion
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  init:
    build: .
    image: onion-site:local
    command: ['node', 'scripts/db-init.mjs']
    environment: &app_env
      DATABASE_URL: mysql://onion:${MYSQL_PASSWORD}@mysql:3306/onion
      UPLOAD_DIR: /app/data/uploads
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SEED_EXAMPLES: ${SEED_EXAMPLES:-false}
    depends_on:
      mysql:
        condition: service_healthy
  app:
    image: onion-site:local
    restart: unless-stopped
    environment: *app_env
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  mysql_data:
  uploads:
